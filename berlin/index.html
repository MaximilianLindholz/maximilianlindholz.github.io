<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'self'; form-action 'self'">
<title>LIEBLINGSORTE IN BERLIN</title>
<meta name="description" content="Lieblingsorte in Berlin – Restaurants, Cafés, Bars und Läden.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    background: #000;
    color: #e8e4e0;
    font-family: 'Courier Prime', monospace;
    line-height: 1.65;
    padding: 56px 24px 96px;
  }

  main { max-width: 64rem; margin: 0 auto; }

  h1 {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.22em;
    margin-bottom: 48px;
  }

  .lede { color: #b9b2ac; max-width: 34rem; margin-bottom: 36px; }

  /* same button as on the home page, inverted for the black background */
  .maps {
    display: inline-block;
    text-decoration: none;
    font-size: 15px; letter-spacing: 0.22em;
    padding: 16px 26px;
    color: #000;
    background: #e8e4e0;
    border: 1px solid #e8e4e0;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .maps:hover, .maps:focus-visible { background: #f9c1ce; border-color: #f9c1ce; }

  /* photos: walls of Berlin, each one opens the list */
  .photos {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin: 56px 0 0;
  }
  /* 7 photos: the first runs over two rows, so the grid closes evenly */
  .photos li:first-child { grid-row: span 2; }
  @media (max-width: 700px) { .photos { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
  .photos a { display: block; height: 100%; overflow: hidden; background: #111; }
  .photos img {
    display: block; width: 100%; height: 100%; aspect-ratio: 3 / 4; object-fit: cover;
    filter: grayscale(0.15);
    transition: transform 0.6s ease, filter 0.3s ease;
  }
  .photos li:first-child img { aspect-ratio: auto; }
  .photos a:hover img, .photos a:focus-visible img { transform: scale(1.03); filter: none; }

  footer { margin-top: 64px; }

  footer a {
    color: #b9b2ac;
    text-decoration: none;
    border-bottom: 1px solid #55504c;
    padding-bottom: 2px;
    font-size: 13px;
    letter-spacing: 0.18em;
  }
  footer a:hover, footer a:focus-visible { color: #f9c1ce; border-bottom-color: #f9c1ce; }
</style>
</head>
<body>

<main>
  <h1>LIEBLINGSORTE IN BERLIN</h1>

  <p class="lede">Restaurants, Cafés, Bars und Läden, gesammelt in einer Google-Maps-Liste.</p>

  <a class="maps" href="https://maps.app.goo.gl/mXASfD4yiwNQMYcEA" target="_blank" rel="noopener noreferrer">LISTE IN GOOGLE MAPS ↗</a>

  <ul class="photos">
    <li><a href="https://maps.app.goo.gl/mXASfD4yiwNQMYcEA" target="_blank" rel="noopener noreferrer"><img src="img/berlin-1.jpg" width="1050" height="1400" alt="Spiegelung eines Hauses im Kanal"></a></li>
    <li><a href="https://maps.app.goo.gl/mXASfD4yiwNQMYcEA" target="_blank" rel="noopener noreferrer"><img src="img/berlin-2.jpg" width="1050" height="1400" alt="Braune Fliesen voller Tags und Sticker" loading="lazy"></a></li>
    <li><a href="https://maps.app.goo.gl/mXASfD4yiwNQMYcEA" target="_blank" rel="noopener noreferrer"><img src="img/berlin-3.jpg" width="1050" height="1400" alt="Steinwand mit Einschusslöchern" loading="lazy"></a></li>
    <li><a href="https://maps.app.goo.gl/mXASfD4yiwNQMYcEA" target="_blank" rel="noopener noreferrer"><img src="img/berlin-4.jpg" width="1050" height="1400" alt="Bemalte Spanplatte mit roter Figur" loading="lazy"></a></li>
    <li><a href="https://maps.app.goo.gl/mXASfD4yiwNQMYcEA" target="_blank" rel="noopener noreferrer"><img src="img/berlin-5.jpg" width="1050" height="1400" alt="Übersprühtes Werbeplakat" loading="lazy"></a></li>
    <li><a href="https://maps.app.goo.gl/mXASfD4yiwNQMYcEA" target="_blank" rel="noopener noreferrer"><img src="img/berlin-6.jpg" width="1050" height="1400" alt="Abgerissenes Plakat in Schwarz-Weiß" loading="lazy"></a></li>
    <li><a href="https://maps.app.goo.gl/mXASfD4yiwNQMYcEA" target="_blank" rel="noopener noreferrer"><img src="img/berlin-7.jpg" width="1050" height="1400" alt="Plakatwand mit Graffiti" loading="lazy"></a></li>
  </ul>

  <footer><a href="/">← START</a></footer>
</main>

</body>
</html>
