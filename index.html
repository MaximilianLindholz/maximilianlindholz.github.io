<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; base-uri 'self'; form-action 'self'">
<title>MAXIMILIAN LINDHOLZ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    min-height: 100vh;
    background: #000;
    color: #e8e4e0;
    font-family: 'Courier Prime', monospace;
    line-height: 1.65;
    padding: 56px 24px 96px;
  }

  main { max-width: 64rem; margin: 0 auto; }

  h1 {
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.22em;
    margin-bottom: 56px;
  }

  /* one photo tile per link, label in the black box from the old home page */
  .tiles {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 700px) { .tiles { grid-template-columns: 1fr; gap: 8px; } }

  .tiles a {
    position: relative;
    display: block;
    overflow: hidden;
    background: #111;
    text-decoration: none;
  }
  .tiles img {
    display: block; width: 100%; height: auto; aspect-ratio: 3 / 4; object-fit: cover;
    filter: grayscale(0.15);
    transition: transform 0.6s ease, filter 0.3s ease;
  }
  @media (max-width: 700px) { .tiles img { aspect-ratio: 4 / 3; } }

  .tiles span {
    position: absolute; left: 0; bottom: 0;
    font-size: 15px; letter-spacing: 0.22em;
    padding: 16px 26px;
    color: #fff;
    background: #000;
    transition: color 0.2s ease;
  }

  .tiles a:hover img, .tiles a:focus-visible img { transform: scale(1.03); filter: none; }
  .tiles a:hover span, .tiles a:focus-visible span { color: #f9c1ce; }
</style>
</head>
<body>

<main>
  <h1>MAXIMILIAN LINDHOLZ</h1>

  <ul class="tiles">
    <li>
      <a href="https://scholar.google.de/citations?user=MSQ2y68AAAAJ&hl=de" target="_blank" rel="noopener noreferrer">
        <img src="berlin/img/berlin-1.jpg" width="1050" height="1400" alt="">
        <span>GOOGLE&nbsp;SCHOLAR&nbsp;↗</span>
      </a>
    </li>
    <li>
      <a href="/projects/">
        <img src="berlin/img/berlin-6.jpg" width="1050" height="1400" alt="">
        <span>PROJECTS</span>
      </a>
    </li>
    <li>
      <a href="/berlin/">
        <img src="berlin/img/berlin-5.jpg" width="1050" height="1400" alt="">
        <span>BERLIN</span>
      </a>
    </li>
  </ul>
</main>

</body>
</html>
